name: Site health monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Least-privilege token: only read repository contents and manage incident issues.
permissions:
  contents: read
  issues: write

concurrency:
  group: site-health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check critical pages
        id: health
        shell: bash
        run: |
          set -uo pipefail
          urls=(
            "https://esfandiyarco.ir/"
            "https://esfandiyarco.ir/contact/"
            "https://esfandiyarco.ir/about/"
            "https://esfandiyarco.ir/digital-services/"
            "https://esfandiyarco.ir/services/social-security/"
          )
          failed=0
          report=""
          for url in "${urls[@]}"; do
            result=$(curl --proto '=https' --tlsv1.2 -L -sS --max-time 25 -o /dev/null -w "%{http_code}" "$url") || code=$?
            code=${code:-0}
            if [ "$code" -ne 0 ] || [ "$result" != "200" ]; then
              failed=1
              report+=$'\n❌ '"$url"$' — HTTP '"${result:-000}"$' (curl exit '"$code"$')'
            else
              report+=$'\n✅ '"$url"$' — HTTP 200'
            fi
            unset code
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo "report<<EOF"
            echo "$report"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update outage incident
        if: steps.health.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.health.outputs.report }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create site-health-outage --repo "$GH_REPO" --color D73A4A --description "Automated website availability incident" 2>/dev/null || true
          existing=$(gh issue list --repo "$GH_REPO" --state open --label site-health-outage --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GH_REPO" --title "Site health alert: esfandiyarco.ir" --label site-health-outage --body "$(printf '%s\n\n%s' "Automated monitoring detected a failure." "$REPORT")"
          else
            gh issue comment "$existing" --repo "$GH_REPO" --body "$(printf '%s\n\n%s' "Repeated check still detects an issue." "$REPORT")"
          fi

      - name: Close resolved outage incident
        if: steps.health.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$GH_REPO" --state open --label site-health-outage --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GH_REPO" --comment "Automated checks are passing again. All monitored pages returned HTTP 200."
          fi
